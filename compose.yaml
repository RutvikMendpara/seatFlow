name: seatflow

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatflow}
      POSTGRES_DB: ${POSTGRES_DB:-seatflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-seatflow}:${POSTGRES_PASSWORD:-seatflow}@postgres:5432/${POSTGRES_DB:-seatflow}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/api/src
          target: /repo/apps/api/src
        - action: sync+restart
          path: apps/api/prisma
          target: /repo/apps/api/prisma
        - action: rebuild
          path: apps/api/package.json

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: apps/web/src
          target: /repo/apps/web/src
        - action: sync
          path: apps/web/public
          target: /repo/apps/web/public
        - action: rebuild
          path: apps/web/package.json

volumes:
  pgdata:
  redisdata:
