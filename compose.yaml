name: seatflow

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatflow}
      POSTGRES_DB: ${POSTGRES_DB:-seatflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-seatflow}:${POSTGRES_PASSWORD:-seatflow}@postgres:5432/${POSTGRES_DB:-seatflow}
      PAYMENT_PROVIDER_URL: http://payments:4100
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-sk_test_seatflow}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_test_seatflow}
      WEB_URL: http://localhost:${WEB_PORT:-3000}
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET:-dev-only-ticket-signing-secret-change-me}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/api/src
          target: /repo/apps/api/src
        - action: sync+restart
          path: apps/api/prisma
          target: /repo/apps/api/prisma
        - action: rebuild
          path: apps/api/package.json

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["pnpm", "start:worker:docker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seatflow}:${POSTGRES_PASSWORD:-seatflow}@postgres:5432/${POSTGRES_DB:-seatflow}
      PAYMENT_PROVIDER_URL: http://payments:4100
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-sk_test_seatflow}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_test_seatflow}
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET:-dev-only-ticket-signing-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      # The API container runs migrations on startup.
      api:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: apps/api/src
          target: /repo/apps/api/src
        - action: sync+restart
          path: apps/api/prisma
          target: /repo/apps/api/prisma
        - action: rebuild
          path: apps/api/package.json

  payments:
    build:
      context: .
      dockerfile: apps/payment-sim/Dockerfile
    environment:
      PUBLIC_URL: http://localhost:${PAYMENTS_PORT:-4100}
      WEBHOOK_URL: http://api:4000/api/payments/webhooks
      SIM_API_KEY: ${PAYMENT_API_KEY:-sk_test_seatflow}
      WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_test_seatflow}
    ports:
      - "${PAYMENTS_PORT:-4100}:4100"
    develop:
      watch:
        - action: sync
          path: apps/payment-sim/src
          target: /app/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: apps/web/src
          target: /repo/apps/web/src
        - action: sync
          path: apps/web/public
          target: /repo/apps/web/public
        - action: rebuild
          path: apps/web/package.json

volumes:
  pgdata:
  redisdata:
